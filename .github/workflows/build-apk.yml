name: Build installable APK
# rebuild marker: proroot-v128-forensics-about-v12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate source integrity
        run: python3 tools/validate_source_integrity.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install Android native toolchain
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.1"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build ARM64 debug APK
        run: |
          APP_VERSION="$(awk '/^version:/ { split($2, value, "+"); print value[1]; exit }' pubspec.yaml)"
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="APP_VERSION=$APP_VERSION" \
            --dart-define="APP_BUILD=$GITHUB_RUN_NUMBER" \
            --dart-define="GIT_SHA=$GITHUB_SHA" \
            --dart-define="PROROOT_VERSION=v1.2.8"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/proroot-pc-arm64-debug.apk
          cd dist
          sha256sum proroot-pc-arm64-debug.apk > proroot-pc-arm64-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proroot-pc-arm64-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
