name: Build installable APK
# rebuild marker: proroot-v128-dbus-bootstrap-anland-teardown-v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate source integrity
        run: python3 tools/validate_source_integrity.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install Android native toolchain
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.1"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build ARM64 debug APK
        run: |
          APP_VERSION="$(awk '/^version:/ { split($2, value, "+"); print value[1]; exit }' pubspec.yaml)"
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="APP_VERSION=$APP_VERSION" \
            --dart-define="APP_BUILD=$GITHUB_RUN_NUMBER" \
            --dart-define="GIT_SHA=$GITHUB_SHA" \
            --dart-define="PROROOT_VERSION=v1.2.8"

      - name: Verify ProRoot runtime is byte-for-byte upstream
        run: |
          rm -rf /tmp/proroot-apk
          mkdir -p /tmp/proroot-apk
          unzip -q build/app/outputs/flutter-apk/app-debug.apk 'lib/arm64-v8a/libproroot*.so' -d /tmp/proroot-apk
          cd /tmp/proroot-apk/lib/arm64-v8a
          cat > expected.sha256 <<'EOF'
          a4e74d75b66cdc02b080adfe863dbf9951c3b30610d77beddc95488d5fe5de01  libproroot.so
          8c47a0a7db32d84c179ebb5bf3640f655a3181860ece5886ae44d92858730c34  libproroot-runtime.so
          1c5bc9537a270e8bf8b1c70222813f57b60b828bfb5503ddf8fe37685092de2f  libproroot-bridge.so
          51a0ec5bfed00e572a0de09e22d9057e2befc386b78e426613d3e0ab03f4ecee  libproroot-linker.so
          06c6624db3bdc45b9ced151cd781df439a37b47731d244b93e9d6a58cd48cde0  libproroot-stub-loader.so
          EOF
          sed -i 's/^          //' expected.sha256
          sha256sum -c expected.sha256

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/proroot-pc-arm64-debug.apk
          cd dist
          sha256sum proroot-pc-arm64-debug.apk > proroot-pc-arm64-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: proroot-pc-arm64-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
