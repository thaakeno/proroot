name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate source integrity
        run: python3 tools/validate_source_integrity.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install Android native toolchain
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print 2>/dev/null | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.1"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Normalize Dart formatting
        run: |
          dart format lib test
          git diff -- lib test || true

      - name: Analyze Dart
        run: flutter analyze --fatal-infos

      - name: Test Dart models
        run: flutter test

      - name: Validate guest scripts
        run: |
          bash -n android/app/src/main/assets/guest/start-desktop.sh
          bash -n android/app/src/main/assets/guest/start-user-session.sh
          bash -n android/app/src/main/assets/guest/start-system-services.sh
          bash -n android/app/src/main/assets/guest/launch-desktop-app.sh
          bash -n android/app/src/main/assets/guest/session-env.sh
          bash -n android/app/src/main/assets/guest/set-desktop-scale.sh
          python3 -m py_compile             android/app/src/main/assets/guest/host_dbus.py             android/app/src/main/assets/guest/host-upower-bridge.py             android/app/src/main/assets/guest/host-login1-bridge.py             android/app/src/main/assets/guest/set-desktop-scale.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/assets/guest/system-bus.conf")
          PY

      - name: Validate staged package architecture normalization
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/pkg/DEBIAN" "$tmp/staged"
          cat >"$tmp/pkg/DEBIAN/control" <<'EOF'
          Package: test-aarch64-package
          Version: 1.0
          Section: misc
          Priority: optional
          Architecture: aarch64
          Maintainer: CI <ci@example.invalid>
          Description: architecture normalization fixture
          EOF
          dpkg-deb -b "$tmp/pkg" "$tmp/staged/test.deb" >/dev/null
          test "$(dpkg-deb -f "$tmp/staged/test.deb" Architecture)" = "aarch64"
          bash android/app/src/main/assets/guest/normalize-staged-debs.sh "$tmp/staged"
          test "$(dpkg-deb -f "$tmp/staged/test.deb" Architecture)" = "arm64"

      - name: Compile Android and native sources
        working-directory: android
        run: |
          ./gradlew --no-daemon             :app:compileDebugKotlin             :app:externalNativeBuildDebug
