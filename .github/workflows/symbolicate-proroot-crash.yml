name: Symbolicate ProRoot crash

on:
  push:
    branches:
      - debug/proroot-symbolicate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Analyze exact binaries
        run: |
          set -euxo pipefail
          base=https://ftp.debian.org/debian/pool/main/g/glibc
          curl -fL "$base/libc6_2.41-12+deb13u4_arm64.deb" -o /tmp/libc6.deb
          curl -fL "$base/libc6-dbg_2.41-12+deb13u4_arm64.deb" -o /tmp/libc6-dbg.deb
          mkdir -p /tmp/libc /tmp/dbg
          dpkg-deb -x /tmp/libc6.deb /tmp/libc
          dpkg-deb -x /tmp/libc6-dbg.deb /tmp/dbg
          libc=/tmp/libc/usr/lib/aarch64-linux-gnu/libc.so.6
          build_id="$(aarch64-linux-gnu-readelf -n "$libc" | awk '/Build ID:/ {print $3; exit}')"
          debug="/tmp/dbg/usr/lib/debug/.build-id/${build_id:0:2}/${build_id:2}.debug"
          curl -fL https://raw.githubusercontent.com/coderredlab/proroot/v1.2.8/arm64-v8a/libproroot-runtime.so -o /tmp/libproroot-runtime.so
          {
            echo "libc build_id=$build_id"
            echo "=== libc candidate offsets ==="
            for off in 0xd5020 0xd500c 0x6ea84 0x6f25c 0x6f33c; do
              echo "--- $off ---"
              aarch64-linux-gnu-addr2line -a -f -C -i -e "$debug" "$off"
            done
            echo
            echo "=== ProRoot signal symbols ==="
            aarch64-linux-gnu-nm -anC /tmp/libproroot-runtime.so | grep -E ' (kill|tkill|tgkill|signal|proroot_sigsegv_handler|proroot_sigsys_handler)$' || true
            for sym in kill tkill tgkill signal proroot_sigsegv_handler; do
              echo
              echo "=== $sym ==="
              aarch64-linux-gnu-objdump -dC --disassemble="$sym" /tmp/libproroot-runtime.so
            done
            echo
            echo "=== trace strings ==="
            strings -tx /tmp/libproroot-runtime.so | grep -E 'PROROOT_TRACE_KILL|PROROOT_TRACE_SIGSEGV_STACK|proroot-sigsegv-maps|SIGSEGV pc=' || true
          } | tee symbolicate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: proroot-symbolication
          path: symbolicate.txt
